[workspace]
members = ["crates/normalize", "crates/planparse", "crates/core", "crates/dbmon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"

[workspace.dependencies]
# 워크스페이스 내부 크레이트
dbmon-normalize = { path = "crates/normalize" }
dbmon-planparse = { path = "crates/planparse" }
dbmon-core = { path = "crates/core" }

# 순수 크레이트(normalize/planparse)가 쓰는 것 — I/O 의존성 없음
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

# core
async-trait = "0.1"
thiserror = "2"

# dbmon (bin) 전용
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.8", features = ["ws"] }
# `fs` 는 SPA 산출물(`web/dist`) 정적 서빙, `set-header` 는 그 응답의
# `Cache-Control`(셸은 no-cache, 해시 자산은 immutable)에 필요하다.
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
mysql_async = { version = "0.36", default-features = false, features = ["default-rustls"] }
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
regex = "1"
futures = "0.3"
rand = "0.9"

# AWS SDK — DynamoDB 어댑터 (M2-4)
#
# `behavior-version-latest` 를 켜지 않으면 클라이언트 생성 시 패닉한다.
# `serde_dynamo` 는 `SlowQuery` 의 serde 구현을 그대로 재사용한다 — AttributeValue 매핑을
# 손으로 쓰면 필드가 추가될 때마다 두 곳을 고쳐야 하고, 그게 이 프로젝트에서 이미 네 번
# 재발한 "미배선/불일치" 클래스다.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-rds = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-bedrockruntime = "1"
aws-sdk-secretsmanager = "1"
# JWKS 조회 전용. `rustls`·`webpki-roots` 는 mysql_async 를 통해 이미 트리에 있어서
# 추가 비용이 거의 없다. `default-features = false` 로 native-tls 를 배제한다 —
# 시스템 OpenSSL 을 요구하면 ARM64 컨테이너 이미지가 커진다.
#
# ⚠ **`-no-provider` 를 써야 한다.** 그냥 `rustls-tls-webpki-roots` 는 rustls 의
# `ring` feature 를 켜고, `mysql_async` 는 `aws-lc-rs` 를 켠다 — 둘이 함께 있으면
# rustls 가 프로세스 기본 프로바이더를 정하지 못해 **첫 TLS 연결에서 패닉한다**
# ("Could not automatically determine the process-level CryptoProvider").
# 통합 테스트 8개가 그렇게 죽었다.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-webpki-roots-no-provider",
  "json",
] }
# RSA 서명 검증(JWKS RS256). **`ring` 이 아니라 이것을 쓴다** — AWS SDK·mysql_async 가
# 이미 이 프로바이더를 쓰므로, `ring` 을 더하면 위와 같은 프로바이더 충돌이 된다.
# API 는 `ring` 과 호환된다(aws-lc-rs 가 그렇게 설계됐다).
aws-lc-rs = "1"
aws-sigv4 = { version = "1", features = ["http1"] }
percent-encoding = "2"
aws-credential-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# 개발 반복 속도. 순수 크레이트 테스트가 대부분이라 opt-level 0 으로 충분하다.
debug = 1
