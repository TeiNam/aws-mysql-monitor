[workspace]
members = ["crates/normalize", "crates/planparse", "crates/core", "crates/dbmon"]
resolver = "3"

[workspace.package]
# **이 값이 버전의 정본이다.** `clap` 이 `--version` 을 여기서 만들고, 컨테이너 이미지
# 태그(`v<버전>-<sha>`)와 GHCR 의 semver 태그가 이걸 따라야 한다.
#
# | 자리 | 올리는 때 |
# |---|---|
# | major | 운영자가 손을 대야 하는 변경 — 설정 키 제거·이름 변경, IAM 정책 추가 요구, 저장 형식 비호환 |
# | minor | 기능 추가. 기존 설정·IAM 으로 그대로 돌아간다 |
# | patch | 버그 수정·문서. 동작이 좁아지지 않는다 |
#
# 릴리스 태그(`v1.2.3`)는 이 값과 **같아야 한다.** 다르면 `release.yml` 이 거부한다 —
# 코드가 `1.0.0` 이라고 말하면서 `1.2.0` 으로 발행되면 어느 이미지가 무엇인지 알 수 없다.
version = "1.0.0"
edition = "2024"
# resolver 3 은 이 값보다 높은 Rust 를 요구하는 버전을 **고르지 않는다.** 1.85 로 두었을 때
# AWS SDK 가 1년 넘게 묶였고 `time` 보안 패치(RUSTSEC-2026-0009)도 함께 막혔다.
# `cargo update --verbose` 에 `requires Rust …` 가 보이면 올릴 때다.
# 1.95 = AWS SDK(1.94.1)와 `Atomic*::try_update`(1.95) 중 높은 쪽.
rust-version = "1.95"
license = "Proprietary"

[workspace.dependencies]
# 워크스페이스 내부 크레이트
dbmon-normalize = { path = "crates/normalize" }
dbmon-planparse = { path = "crates/planparse" }
dbmon-core = { path = "crates/core" }

# 순수 크레이트(normalize/planparse)가 쓰는 것 — I/O 의존성 없음
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

# core
async-trait = "0.1"
thiserror = "2"

# dbmon (bin) 전용
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.8", features = ["ws"] }
# `fs` 는 SPA 산출물(`web/dist`) 정적 서빙, `set-header` 는 그 응답의
# `Cache-Control`(셸은 no-cache, 해시 자산은 immutable)에 필요하다.
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
zeroize = { version = "1", features = ["derive"] }
base64 = "0.23"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
futures = "0.3"

# AWS SDK — DynamoDB 어댑터 (M2-4)
#
# `behavior-version-latest` 를 켜지 않으면 클라이언트 생성 시 패닉한다.
# `serde_dynamo` 는 `SlowQuery` 의 serde 구현을 그대로 재사용한다 — AttributeValue 매핑을
# 손으로 쓰면 필드가 추가될 때마다 두 곳을 고쳐야 하고, 그게 이 프로젝트에서 이미 네 번
# 재발한 "미배선/불일치" 클래스다.
aws-config = { version = "1", features = ["behavior-version-latest"] }
# ⚠ **기본 feature 를 끈다.** 기본값의 `rustls` 는 레거시 커넥터(hyper 0.14 + rustls 0.21 +
# ring)를 같이 끌어온다 — 최신 SDK 에서도 그렇다. 그 스택의 h2 0.3·rustls-webpki 0.101 에
# RUSTSEC 권고가 걸려 있고 그 줄에는 고친 버전이 없다. HTTP 는 `default-https-client`
# (hyper 1 + rustls 0.23 + aws-lc-rs)가 맡는다. `aws-config` 는 기본값에 레거시가 없다.
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-rds = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatch = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# JWKS 조회 전용. `default-features = false` 로 native-tls 를 배제한다 — 시스템 OpenSSL 을
# 요구하면 ARM64 컨테이너 이미지가 커진다.
#
# ⚠ 0.13 부터 신뢰 루트가 번들(webpki-roots)이 아니라 **시스템 CA** 다
# (`rustls-platform-verifier`). 런타임 이미지의 `ca-certificates` 를 빼면 JWKS 조회가 깨진다.
#
# `rustls` 는 `aws-lc-rs` 를 쓰고, 프로세스 기본 프로바이더가 없으면 그것을 스스로 고른다.
# 0.12 는 두 함정 사이에 있었다 — `rustls-tls-webpki-roots` 는 rustls 의 `ring` 을 켜서
# `mysql_async` 의 `aws-lc-rs` 와 겹쳐 **첫 TLS 연결에서 패닉했고**(통합 테스트 8개),
# `-no-provider` 는 설치를 잊으면 "No provider set" 으로 패닉했다(ECS 롤백).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# RSA 서명 검증(JWKS RS256). **`ring` 이 아니라 이것을 쓴다** — AWS SDK·mysql_async 가
# 이미 이 프로바이더를 쓰므로, `ring` 을 더하면 위와 같은 프로바이더 충돌이 된다.
# API 는 `ring` 과 호환된다(aws-lc-rs 가 그렇게 설계됐다).
aws-lc-rs = "1"
# 프로세스 기본 CryptoProvider 를 **명시적으로** 설치하기 위해 직접 의존한다.
# 이미 트리에 있으므로 크레이트가 늘지 않는다.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
aws-sigv4 = { version = "1", features = ["http1"] }
percent-encoding = "2"
aws-credential-types = "1"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# 개발 반복 속도. 순수 크레이트 테스트가 대부분이라 opt-level 0 으로 충분하다.
debug = 1
