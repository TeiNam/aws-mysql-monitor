[package]
name = "dbmon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "aws-mysql-monitor 단일 바이너리"

[[bin]]
name = "dbmon"
path = "src/main.rs"

[features]
# 테스트 전용 생성자를 노출한다. 통합 테스트(`tests/`)는 별도 크레이트이므로
# `#[cfg(test)]` 만으로는 보이지 않는다.
testing = []

[dependencies]
dbmon-core.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-rds.workspace = true
aws-sdk-cloudwatchlogs.workspace = true
aws-sigv4.workspace = true
percent-encoding.workspace = true
aws-credential-types.workspace = true
aws-smithy-runtime-api.workspace = true
serde_dynamo.workspace = true
dbmon-normalize.workspace = true
dbmon-planparse.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
toml.workspace = true
async-trait.workspace = true
zeroize.workspace = true
futures.workspace = true
rand.workspace = true
mysql_async.workspace = true
chrono.workspace = true
hex.workspace = true
sha2.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# 통합 테스트만 페이크와 테스트 전용 생성자를 본다. 프로덕션 바이너리는 못 본다.
dbmon-core = { workspace = true, features = ["testing"] }
dbmon = { path = ".", features = ["testing"] }
