<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      CSS 가 오기 전에도 어두운 배경으로 시작한다. 없으면 야간에 흰 화면이
      한 번 번쩍인다.
    -->
    <meta name="color-scheme" content="dark" />
    <title>dbmon — MySQL 슬로우 쿼리 모니터</title>
    <!--
      토큰이 URL 로 오는 경우가 있다(컨테이너 로컬 개발). `Referer` 헤더로
      새어 나가지 않게 참조자를 제한한다.
    -->
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <div id="root"></div>
    <!-- JS 가 없으면 빈 화면이 아니라 이유를 보여 준다. -->
    <noscript>
      이 화면은 실시간 스트림을 쓰므로 JavaScript 가 필요하다. 데이터는
      <code>/api/slow-queries</code> 로 직접 조회할 수 있다.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
